<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <g fill="#8b5cf6">
    <!-- Vertical Spine (5 blocks high) -->
    <rect x="21" y="1" width="18" height="18" rx="4" />
    <rect x="21" y="21" width="18" height="18" rx="4" />
    <rect x="21" y="41" width="18" height="18" rx="4" />
    <rect x="21" y="61" width="18" height="18" rx="4" />
    <rect x="21" y="81" width="18" height="18" rx="4" />

    <!-- Loop Top & Bottom -->
    <rect x="41" y="41" width="18" height="18" rx="4" />
    <rect x="41" y="81" width="18" height="18" rx="4" />

    <!-- Loop Right Side (3 blocks high) -->
    <rect x="61" y="41" width="18" height="18" rx="4" />
    <rect x="61" y="61" width="18" height="18" rx="4" />
    <rect x="61" y="81" width="18" height="18" rx="4" />
  </g>
</svg>